include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # SDK source filenames intentionally mirror the iOS PascalCase convention.
    file_names: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
